
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SSVEP BCI Numerical Keypad</title>

<style>

body{
  margin:0;
  min-height:100vh;
  background:#05070a;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, Helvetica, sans-serif;
  color:white;
}

.container{
  width:420px;
  background:#0d1117;
  border:1px solid #1f2937;
  border-radius:22px;
  padding:22px;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.connection{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#8b949e;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00ff66;
  box-shadow:0 0 10px #00ff66;
}

.panel{
  background:#000;
  border:1px solid #222;
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
}

.label{
  color:#6b7280;
  font-size:11px;
  margin-bottom:8px;
  letter-spacing:1px;
}

.number{
  font-size:32px;
  letter-spacing:5px;
  min-height:40px;
}

.cursor{
  animation:blink 1s infinite;
  color:#aaa;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0}
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

.stat-box{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

.stat-title{
  font-size:10px;
  color:#6b7280;
  margin-bottom:6px;
}

.stat-value{
  font-size:15px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.key,
.icon{
  height:82px;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.key{
  background:#111827;
  border:1px solid #293548;
  opacity:0.25;
  transition:0.2s;
}

.key:hover{
  transform:scale(1.03);
}

.key-num{
  font-size:30px;
  font-weight:bold;
}

.freq{
  font-size:11px;
  color:#9ca3af;
  margin-top:4px;
}

.icon{
  background:#0b0f14;
  border:1px solid #1b2430;
  opacity:0.55;
}

.icon span{
  font-size:26px;
}

.green{color:#00ff66;}
.red{color:#ff5c5c;}

.selected{
  background:#12351d !important;
  border-color:#00ff66 !important;
  opacity:1 !important;
  box-shadow:0 0 18px rgba(0,255,100,0.4);
}

.target{
  border-color:#4ea1ff !important;
  box-shadow:0 0 18px rgba(78,161,255,0.35);
}

.processing{
  animation:pulse 0.8s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

/* Simulated SSVEP frequencies */
.f1{animation:f1 0.20s infinite;}
.f2{animation:f2 0.16s infinite;}
.f3{animation:f3 0.13s infinite;}
.f4{animation:f4 0.10s infinite;}

@keyframes f1{
  0%,50%{opacity:1}
  51%,100%{opacity:0.2}
}

@keyframes f2{
  0%,50%{opacity:1}
  51%,100%{opacity:0.2}
}

@keyframes f3{
  0%,50%{opacity:1}
  51%,100%{opacity:0.2}
}

@keyframes f4{
  0%,50%{opacity:1}
  51%,100%{opacity:0.2}
}

.pipeline{
  margin-top:18px;
  background:#0b0f14;
  border:1px solid #1f2937;
  border-radius:14px;
  padding:12px;
}

.pipeline-title{
  font-size:11px;
  color:#6b7280;
  margin-bottom:10px;
}

.pipeline-steps{
  display:flex;
  justify-content:space-between;
  gap:6px;
  flex-wrap:wrap;
}

.step{
  flex:1;
  min-width:70px;
  background:#111827;
  border-radius:10px;
  padding:8px;
  text-align:center;
  font-size:10px;
  border:1px solid #293548;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  flex:1;
  border:none;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.start{
  background:#00c853;
  color:black;
}

.clear{
  background:#1f2937;
  color:white;
}

button:hover{
  transform:translateY(-1px);
}

.status{
  margin-top:14px;
  text-align:center;
  color:#9ca3af;
  font-size:13px;
  min-height:18px;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="title">SSVEP BCI Keypad</div>

    <div class="connection">
      <div class="dot"></div>
      EEG Connected
    </div>
  </div>

  <div class="panel">
    <div class="label">REAL-TIME OUTPUT</div>
    <div class="number" id="disp">
      <span class="cursor">_</span>
    </div>
  </div>

  <div class="stats">

    <div class="stat-box">
      <div class="stat-title">CHANNELS</div>
      <div class="stat-value">8 EEG</div>
    </div>

    <div class="stat-box">
      <div class="stat-title">SAMPLING</div>
      <div class="stat-value">250 Hz</div>
    </div>

    <div class="stat-box">
      <div class="stat-title">PARADIGM</div>
      <div class="stat-value">SSVEP</div>
    </div>

  </div>

  <div class="grid">

    <div class="key f1" id="k1">
      <div class="key-num">1</div>
      <div class="freq">8 Hz</div>
    </div>

    <div class="key f2" id="k2">
      <div class="key-num">2</div>
      <div class="freq">10 Hz</div>
    </div>

    <div class="key f3" id="k3">
      <div class="key-num">3</div>
      <div class="freq">12 Hz</div>
    </div>

    <div class="key f2" id="k4">
      <div class="key-num">4</div>
      <div class="freq">9 Hz</div>
    </div>

    <div class="key f3" id="k5">
      <div class="key-num">5</div>
      <div class="freq">11 Hz</div>
    </div>

    <div class="key f4" id="k6">
      <div class="key-num">6</div>
      <div class="freq">13 Hz</div>
    </div>

    <div class="key f1" id="k7">
      <div class="key-num">7</div>
      <div class="freq">7 Hz</div>
    </div>

    <div class="key f2" id="k8">
      <div class="key-num">8</div>
      <div class="freq">14 Hz</div>
    </div>

    <div class="key f3" id="k9">
      <div class="key-num">9</div>
      <div class="freq">15 Hz</div>
    </div>

    <div class="icon green">
      <span>📲</span>
    </div>

    <div class="key f4" id="k0">
      <div class="key-num">0</div>
      <div class="freq">16 Hz</div>
    </div>

    <div class="icon red">
      <span>❌📞</span>
    </div>

  </div>

  <div class="pipeline">

    <div class="pipeline-title">
      REAL-TIME BCI PIPELINE
    </div>

    <div class="pipeline-steps">
      <div class="step">EEG Acquisition</div>
      <div class="step">Filtering</div>
      <div class="step">SSVEP Detection</div>
      <div class="step">Classification</div>
      <div class="step">Keypad Output</div>
    </div>

  </div>

  <div class="controls">
    <button class="start" onclick="startSSVEP()">
      Start Detection
    </button>

    <button class="clear" onclick="clearDisplay()">
      Clear
    </button>
  </div>

  <div class="status" id="status">
    System Ready
  </div>

</div>

<script>

const keys = ['k1','k2','k3','k4','k5','k6','k7','k8','k9','k0'];

const keyVals = {
  k1:'1',k2:'2',k3:'3',k4:'4',k5:'5',
  k6:'6',k7:'7',k8:'8',k9:'9',k0:'0'
};

let scores = {};
let running = false;
let targetKey = null;
let number = '';

function updateDisplay(){

  document.getElementById('disp').innerHTML =
    (number || '') + '<span class="cursor">_</span>';
}

function clearDisplay(){

  number = '';
  updateDisplay();

  keys.forEach(k=>{
    document.getElementById(k).classList.remove('selected');
  });

  document.getElementById('status').textContent =
    'Display cleared';
}

function startSSVEP(){

  if(running) return;

  running = true;

  keys.forEach(k=>{

    scores[k] = 0;

    document.getElementById(k).classList.remove(
      'selected',
      'target',
      'processing'
    );
  });

  targetKey = keys[
    Math.floor(Math.random()*keys.length)
  ];

  document.getElementById(targetKey)
    .classList.add('target','processing');

  document.getElementById('status').textContent =
    'User focusing on stimulus: ' + keyVals[targetKey];

  let t = 0;

  let interval = setInterval(()=>{

    keys.forEach(k=>{

      if(k === targetKey){
        scores[k] += 1.2 + Math.random()*0.3;
      }
      else{
        scores[k] += Math.random()*0.25;
      }
    });

    t++;

    document.getElementById('status').textContent =
      'Processing EEG data... ' + (t*2) + '%';

    if(t > 50){
      clearInterval(interval);
      finalize();
    }

  },100);
}

function finalize(){

  let best = keys[0];

  keys.forEach(k=>{

    if(scores[k] > scores[best]){
      best = k;
    }
  });

  document.getElementById(best)
    .classList.remove('target','processing');

  document.getElementById(best)
    .classList.add('selected');

  number += keyVals[best];

  updateDisplay();

  running = false;

  document.getElementById('status').textContent =
    'Detected command: ' + keyVals[best] +
    ' | Classification confidence: 94%';
}

updateDisplay();

</script>

</body>
</html>
