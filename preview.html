<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>SSVEP Phone BCI</title>

<style>
  .numpad-wrap {
    background: #111;
    border-radius: 12px;
    padding: 24px;
    max-width: 360px;
    margin: 0 auto;
    font-family: monospace;
  }

  .display {
    background: #000;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 20px;
  }

  .display-label {
    font-size: 11px;
    color: #555;
  }

  .display-number {
    font-size: 26px;
    color: #fff;
    letter-spacing: 3px;
  }

  .display-cursor {
    animation: blink 1s infinite;
    color: #aaa;
  }

  @keyframes blink {
    0%,100%{opacity:1}
    50%{opacity:0}
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    align-items: center;
  }

  .key {
    background: #1a1a1a;
    border: 1.5px solid #333;
    border-radius: 8px;
    padding: 14px 8px;
    text-align: center;
    opacity: 0.2;
  }

  .key-num {
    font-size: 22px;
    color: #fff;
  }

  /* SSVEP flicker */
  .f1 { animation: f1 0.22s infinite; }
  .f2 { animation: f2 0.18s infinite; }
  .f3 { animation: f3 0.14s infinite; }
  .f4 { animation: f4 0.11s infinite; }

  @keyframes f1 { 0%,50%{opacity:1} 51%,100%{opacity:0.2} }
  @keyframes f2 { 0%,50%{opacity:1} 51%,100%{opacity:0.2} }
  @keyframes f3 { 0%,50%{opacity:1} 51%,100%{opacity:0.2} }
  @keyframes f4 { 0%,50%{opacity:1} 51%,100%{opacity:0.2} }

  .selected {
    background: #1a3a1a !important;
    border-color: #2a7a2a !important;
    opacity: 1 !important;
  }

  .icon {
    background: #0d0d0d;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 14px 8px;
    text-align: center;
    opacity: 0.4;
    pointer-events: none;
  }

  .icon span {
    font-size: 18px;
  }

  .green { color: #4cff4c; }
  .red { color: #ff4c4c; }

  .btn {
    margin-top: 12px;
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 10px;
    color: #4cff4c;
    cursor: pointer;
    border-radius: 6px;
  }

  .status {
    margin-top: 10px;
    font-size: 11px;
    color: #666;
    text-align: center;
  }
</style>
</head>

<body>

<div class="numpad-wrap">

  <div class="display">
    <div class="display-label">NÚMERO</div>
    <div class="display-number" id="disp"><span class="display-cursor">_</span></div>
  </div>

  <div class="grid">

    <!-- 1 2 3 -->
    <div class="key f1" id="k1"><div class="key-num">1</div></div>
    <div class="key f2" id="k2"><div class="key-num">2</div></div>
    <div class="key f3" id="k3"><div class="key-num">3</div></div>

    <!-- 4 5 6 -->
    <div class="key f2" id="k4"><div class="key-num">4</div></div>
    <div class="key f3" id="k5"><div class="key-num">5</div></div>
    <div class="key f4" id="k6"><div class="key-num">6</div></div>

    <!-- 7 8 9 -->
    <div class="key f1" id="k7"><div class="key-num">7</div></div>
    <div class="key f2" id="k8"><div class="key-num">8</div></div>
    <div class="key f3" id="k9"><div class="key-num">9</div></div>

    <!-- ICON - 0 - ICON -->
    <div class="icon green">
      <span>📲</span>
    </div>

    <div class="key f4" id="k0"><div class="key-num">0</div></div>

    <div class="icon red">
      <span>❌📞</span>
    </div>

  </div>

  <button class="btn" onclick="startSSVEP()">Iniciar SSVEP</button>

  <div class="status" id="status">Listo</div>

</div>

<script>

const keys = ['k1','k2','k3','k4','k5','k6','k7','k8','k9','k0'];

const keyVals = {
  k1:'1',k2:'2',k3:'3',k4:'4',k5:'5',
  k6:'6',k7:'7',k8:'8',k9:'9',k0:'0'
};

let scores = {};
let running = false;
let targetKey = null;
let number = "";

function updateDisplay(){
  document.getElementById("disp").innerHTML =
    (number || "") + '<span class="display-cursor">_</span>';
}

function startSSVEP(){

  if(running) return;
  running = true;

  keys.forEach(k=>{
    scores[k] = 0;
  });

  targetKey = keys[Math.floor(Math.random()*keys.length)];

  document.getElementById("status").textContent =
    "Fija la vista en: " + keyVals[targetKey];

  let t = 0;

  let interval = setInterval(()=>{

    keys.forEach(k=>{
      if(k === targetKey){
        scores[k] += 1.2;
      } else {
        scores[k] += Math.random()*0.3;
      }
    });

    t++;

    if(t > 50){
      clearInterval(interval);
      finalize();
    }

  },100);
}

function finalize(){

  let best = keys[0];

  keys.forEach(k=>{
    if(scores[k] > scores[best]){
      best = k;
    }
  });

  document.getElementById(best).classList.add("selected");

  number += keyVals[best];
  updateDisplay();

  running = false;

  document.getElementById("status").textContent =
    "Seleccionado: " + keyVals[best];
}

updateDisplay();

</script>

</body>
</html>
